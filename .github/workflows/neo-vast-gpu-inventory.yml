name: NEO Vast GPU Inventory

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum offers to pull from Vast marketplace"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      OFFER_LIMIT: ${{ inputs.limit }}
    steps:
      - name: Validate access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VAST_API_KEY" || { echo "Missing VAST_API_KEY secret"; exit 1; }
          python - <<'PY'
          import os
          n=int(os.environ["OFFER_LIMIT"])
          if n < 1 or n > 1000: raise SystemExit("limit must be 1..1000")
          PY

      - name: Pull live GPU marketplace inventory directly from Vast API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, csv, requests
          from datetime import datetime, timezone
          from pathlib import Path

          limit=int(os.environ["OFFER_LIMIT"])
          url="https://cloud.vast.ai/api/v0/bundles/"
          query={
              "limit": limit,
              "rentable": {"eq": True},
              "rented": {"eq": False},
              "order": [["dph_total", "asc"]],
          }
          response=requests.get(
              url,
              headers={"Authorization": "Bearer "+os.environ["VAST_API_KEY"]},
              params={"q": json.dumps(query, separators=(",", ":"))},
              timeout=60,
          )
          response.raise_for_status()
          payload=response.json()
          offers=payload.get("offers", []) if isinstance(payload, dict) else payload
          rows=[]
          for o in offers:
              rows.append({
                  "id": o.get("id"),
                  "gpu_name": o.get("gpu_name"),
                  "num_gpus": o.get("num_gpus"),
                  "gpu_ram_mb": o.get("gpu_ram"),
                  "gpu_frac": o.get("gpu_frac"),
                  "hourly_total_usd": o.get("dph_total"),
                  "hourly_compute_usd": o.get("dph"),
                  "verified": o.get("verified"),
                  "rentable": o.get("rentable"),
                  "rented": o.get("rented"),
                  "reliability": o.get("reliability"),
                  "reliability2": o.get("reliability2"),
                  "download_mbps": o.get("inet_down"),
                  "upload_mbps": o.get("inet_up"),
                  "bandwidth_cost": o.get("bw"),
                  "storage_cost": o.get("storage_cost"),
                  "disk_gb": o.get("disk_space"),
                  "geolocation": o.get("geolocation"),
                  "host_id": o.get("host_id"),
              })
          Path("vast-gpu-inventory.json").write_text(json.dumps({
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "returned_count": len(rows),
              "response": payload,
          }, indent=2))
          fields=list(rows[0].keys()) if rows else [
              "id","gpu_name","num_gpus","gpu_ram_mb","gpu_frac","hourly_total_usd",
              "hourly_compute_usd","verified","rentable","rented","reliability",
              "reliability2","download_mbps","upload_mbps","bandwidth_cost",
              "storage_cost","disk_gb","geolocation","host_id"
          ]
          with open("vast-gpu-inventory.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          print("LIVE VAST GPU INVENTORY — all rentable offers returned by API")
          print("Offers returned:",len(rows)," | truncated:",payload.get("truncated") if isinstance(payload,dict) else "unknown")
          print("ID | GPU | VRAM MB | Fraction | TOTAL $/h | VERIFIED | RELIABILITY | DOWN/UP Mbps | LOCATION")
          for x in sorted(rows,key=lambda z: float(z["hourly_total_usd"] or 999999)):
              print("{} | {} x{} | {} | {} | {} | {} | {} | {}/{} | {}".format(
                  x["id"],x["gpu_name"],x["num_gpus"],x["gpu_ram_mb"],x["gpu_frac"],
                  x["hourly_total_usd"],x["verified"],x["reliability2"] or x["reliability"],
                  x["download_mbps"],x["upload_mbps"],x["geolocation"]))
          PY

      - name: Upload full inventory for offer-ID review
        uses: actions/upload-artifact@v4
        with:
          name: vast-gpu-inventory
          path: |
            vast-gpu-inventory.json
            vast-gpu-inventory.csv
          retention-days: 7
