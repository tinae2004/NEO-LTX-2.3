name: NEO Destroy Vast GPU
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Exact Vast instance ID to destroy
        required: true
        type: string
      confirm_destroy:
        description: Type DESTROY to confirm permanent termination
        required: true
        type: string
permissions:
  contents: read
jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      INSTANCE_ID: ${{ inputs.instance_id }}
      CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
    steps:
      - name: Validate explicit confirmation
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^[0-9]{4,12}$ ]] || { echo "Invalid instance ID"; exit 1; }
          [ "$CONFIRM_DESTROY" = "DESTROY" ] || { echo "Type DESTROY to confirm"; exit 1; }
          [ -n "$VAST_API_KEY" ] || { echo "Missing VAST_API_KEY"; exit 1; }
      - name: Install Vast CLI
        run: python -m pip install --upgrade vastai
      - name: Destroy requested instance
        run: |
          set -euo pipefail
          vastai set api-key "$VAST_API_KEY"
          echo "Requesting destruction of Vast instance $INSTANCE_ID"
          vastai destroy instance "$INSTANCE_ID" -y --raw
          echo "Destroy command submitted for instance $INSTANCE_ID"