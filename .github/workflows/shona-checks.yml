name: NEO Shona data pipeline checks

on:
  pull_request:
    branches: [neo-video-gen]
  push:
    branches: [neo-shona-engine]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q neo_video_gen scripts tests
      - name: Run tests
        run: pytest -q
