name: NEO Vast GPU Smoke Test

on:
  workflow_dispatch:
    inputs:
      max_hourly_usd:
        description: "Hard maximum compute price in USD/hour (storage and bandwidth are checked separately)"
        required: true
        default: "0.40"
        type: string
      gpu_family:
        description: "RTX GPU family"
        required: true
        default: "RTX_3090"
        type: choice
        options:
          - RTX_3090
          - RTX_4090
          - either
      keep_gpu:
        description: "Keep the GPU after a successful smoke test (continues billing)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: neo-vast-gpu-smoke
  cancel-in-progress: false

jobs:
  gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      NEO_WORKER_SECRET: ${{ secrets.NEO_WORKER_SECRET }}
      MAX_HOURLY_USD: ${{ inputs.max_hourly_usd }}
      GPU_FAMILY: ${{ inputs.gpu_family }}
      KEEP_GPU: ${{ inputs.keep_gpu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate budget and credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from decimal import Decimal
          cap = Decimal(os.environ["MAX_HOURLY_USD"])
          if cap <= 0 or cap > Decimal("0.40"):
              raise SystemExit("Budget must be > 0 and <= $0.40/hour.")
          if not os.environ.get("VAST_API_KEY"):
              raise SystemExit("Missing GitHub Actions secret VAST_API_KEY.")
          if not os.environ.get("NEO_WORKER_SECRET") or len(os.environ["NEO_WORKER_SECRET"]) < 32:
              raise SystemExit("NEO_WORKER_SECRET must be set and at least 32 characters.")
          PY

      - name: Install Vast CLI and SSH client
        run: |
          python -m pip install --upgrade pip
          python -m pip install vastai
          sudo apt-get update
          sudo apt-get install -y openssh-client jq

      - name: Find and rent one verified RTX GPU
        id: rent
        shell: bash
        run: |
          set -euo pipefail
          vastai set api-key "$VAST_API_KEY"
          echo "Searching verified RTX offers within compute cap..."
          if [ "$GPU_FAMILY" = "either" ]; then
            A="$(vastai search offers "gpu_name=RTX_3090 num_gpus=1 rentable=true verified=true gpu_ram>=24000 dph_total<=$MAX_HOURLY_USD" -o "dph_total" --raw)"
            B="$(vastai search offers "gpu_name=RTX_4090 num_gpus=1 rentable=true verified=true gpu_ram>=24000 dph_total<=$MAX_HOURLY_USD" -o "dph_total" --raw)"
            OFFERS="$(python -c 'import json,sys; a=json.loads(sys.argv[1]); b=json.loads(sys.argv[2]); a=a if isinstance(a,list) else a.get("offers",[]); b=b if isinstance(b,list) else b.get("offers",[]); print(json.dumps(a+b))' "$A" "$B")"
          else
            OFFERS="$(vastai search offers "gpu_name=$GPU_FAMILY num_gpus=1 rentable=true verified=true gpu_ram>=24000 dph_total<=$MAX_HOURLY_USD" -o "dph_total" --raw)"
          fi
          python - "$OFFERS" "$MAX_HOURLY_USD" <<'PY' > selected_offer.txt
          import json, sys
          raw, cap = sys.argv[1], float(sys.argv[2])
          data = json.loads(raw)
          if isinstance(data, dict):
              data = data.get("offers", [])
          candidates = []
          for x in data:
              try:
                  price = float(x.get("dph_total", 999))
                  ram = float(x.get("gpu_ram", 0))
                  down = float(x.get("inet_down", 0) or 0)
                  up = float(x.get("inet_up", 0) or 0)
                  bandwidth = float(x.get("bw", 0) or 0)
                  storage = float(x.get("storage_cost", 0) or 0)
                  if price <= cap and ram >= 24000 and x.get("verified") and x.get("rentable"):
                      # Prioritise network speed, then compute, bandwidth and storage costs.
                      score = (down + up) - (price * 100) - (bandwidth * 1000) - (storage * 100)
                      candidates.append((score, x))
              except (TypeError, ValueError):
                  pass
          if not candidates:
              raise SystemExit("No verified, rentable 24GB+ RTX offer fits the hourly compute cap. No GPU was rented.")
          candidates.sort(key=lambda z: z[0], reverse=True)
          best = candidates[0][1]
          print(best["id"])
          print(f"Selected {best.get('gpu_name')} | {best.get('gpu_ram')} MB | ${best.get('dph_total')}/h compute | down {best.get('inet_down')} Mbps | up {best.get('inet_up')} Mbps | bandwidth {best.get('bw')} | storage {best.get('storage_cost')}", file=sys.stderr)
          PY
          OFFER_ID="$(head -n1 selected_offer.txt)"
          echo "offer_id=$OFFER_ID" >> "$GITHUB_OUTPUT"
          vastai create instance "$OFFER_ID" --image "pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime" --disk 100 --ssh --direct --cancel-unavail --env "-e NEO_WORKER_SECRET=$NEO_WORKER_SECRET -e NEO_WORKER_ROOT=/workspace/NEO-LTX-2.3 -e NEO_WORKER_STATE=/workspace/neo-state -e NEO_REPO_BRANCH=neo-reasoning-dev -p 8765:8765" --onstart ./neo/worker/onstart.sh --label "NEO-GPU-SMOKE-${GITHUB_RUN_ID}"
          sleep 3
          INSTANCE_ID="$(vastai show instances --raw | python -c 'import json,sys; a=json.load(sys.stdin); a=a if isinstance(a,list) else a.get("instances",[]); xs=[x for x in a if str(x.get("label","")).endswith("'"$GITHUB_RUN_ID"'")]; print(xs[-1]["id"] if xs else "")')"
          if [ -z "$INSTANCE_ID" ]; then
            echo "Could not resolve newly created instance ID; stopping to avoid an unmanaged rental."
            exit 1
          fi
          echo "$INSTANCE_ID" > instance_id.txt
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH and verify CUDA GPU
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.rent.outputs.instance_id }}"
          CONNECT=""
          for i in $(seq 1 60); do
            CONNECT="$(vastai ssh-url "$INSTANCE_ID" 2>/dev/null || true)"
            if [ -n "$CONNECT" ]; then break; fi
            sleep 10
          done
          if [ -z "$CONNECT" ]; then echo "GPU did not expose SSH within 10 minutes."; exit 1; fi
          HOST="$(echo "$CONNECT" | sed -E 's#ssh://[^@]+@([^:]+):.*#\1#')"
          PORT="$(echo "$CONNECT" | sed -E 's#.*:([0-9]+)$#\1#')"
          if [ "$HOST" = "$CONNECT" ] || [ "$PORT" = "$CONNECT" ]; then
            echo "Could not parse Vast SSH endpoint: $CONNECT"; exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keygen -R "[$HOST]:$PORT" >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -p "$PORT" root@"$HOST" 'set -e; nvidia-smi; python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__); print(torch.cuda.get_device_name(0)); print(round(torch.cuda.get_device_properties(0).total_memory/1024**3,1), \"GiB\")"; apt-get update -qq; apt-get install -y -qq git; git clone --depth 1 --branch neo-reasoning-dev https://github.com/tinae2004/NEO-LTX-2.3.git /workspace/NEO-LTX-2.3; python -m pip install -q pytest numpy soundfile; cd /workspace/NEO-LTX-2.3; python -m pytest -q neo/speech/test_dialogue.py' ; then
              exit 0
            fi
            sleep 10
          done
          echo "SSH connected but CUDA verification did not pass."; exit 1


      - name: Verify worker API is alive and authenticated
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="$(cat instance_id.txt)"
          API_URL=""
          for i in $(seq 1 90); do
            INSTANCE="$(vastai show instance "$INSTANCE_ID" --raw 2>/dev/null || true)"
            API_URL="$(python - "$INSTANCE" <<'PY'
          import json,sys
          try:
              d=json.loads(sys.argv[1])
              ip=d.get("public_ipaddr") or d.get("public_ip")
              ports=d.get("ports") or {}
              entries=ports.get("8765/tcp") or ports.get("8765") or []
              if isinstance(entries,dict): entries=[entries]
              port=(entries[0].get("HostPort") or entries[0].get("host_port")) if entries else None
              if ip and port: print("http://{}:{}".format(ip,port))
          except Exception: pass
          PY
          )"
            if [ -n "$API_URL" ] && curl -fsS --max-time 5 "$API_URL/health" >/dev/null; then
              echo "NEO worker API is responding."
              curl -fsS --max-time 10 -H "Authorization: Bearer $NEO_WORKER_SECRET" "$API_URL/v1/gpu" | tee worker-gpu.json
              exit 0
            fi
            sleep 20
          done
          echo "Worker API did not become reachable within 30 minutes."
          exit 1

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-gpu-smoke-summary
          path: |
            instance_id.txt
            selected_offer.txt
            worker-gpu.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Destroy rented GPU
        if: always() && (inputs.keep_gpu != true || job.status != 'success')
        shell: bash
        run: |
          set -euo pipefail
          if [ -f instance_id.txt ] && [ -n "$VAST_API_KEY" ]; then
            vastai set api-key "$VAST_API_KEY"
            INSTANCE_ID="$(cat instance_id.txt)"
            echo "Destroying temporary NEO test instance $INSTANCE_ID"
            vastai destroy instance "$INSTANCE_ID" || true
          else
            echo "No recorded instance ID to clean up."
          fi
