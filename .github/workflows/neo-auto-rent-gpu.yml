name: NEO LTX-2.3 GPU Agent Deploy
run-name: NEO GPU deploy • ${{ github.ref_name }} • ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      max_hourly_usd:
        description: Hard maximum total GPU price per hour (USD)
        required: true
        default: "0.40"
        type: string
      max_bandwidth_usd_per_gb:
        description: Maximum upload/download bandwidth price per GB
        required: true
        default: "0.03"
        type: string
      keep_gpu:
        description: Keep the GPU after successful readiness checks (billing continues)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: neo-ltx-gpu-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      NEO_WORKER_TOKEN: ${{ secrets.NEO_WORKER_SECRET }}
      NEO_BUCKET: ${{ vars.NEO_BUCKET || 'Tinae/neo-bucket' }}
      MAX_HOURLY_USD: ${{ inputs.max_hourly_usd }}
      MAX_BANDWIDTH_USD_PER_GB: ${{ inputs.max_bandwidth_usd_per_gb }}

    steps:
      - name: Checkout NEO deployment source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment secrets and hard limits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          cap=float(os.environ["MAX_HOURLY_USD"])
          bw=float(os.environ["MAX_BANDWIDTH_USD_PER_GB"])
          assert 0 < cap <= 0.40, "GPU hourly cap must be >0 and <= $0.40"
          assert 0 < bw <= 0.03, "Bandwidth cap must be >0 and <= $0.03/GB"
          assert os.environ.get("VAST_API_KEY"), "Missing VAST_API_KEY secret"
          assert len(os.environ.get("NEO_WORKER_TOKEN","")) >= 32, "Missing/short NEO_WORKER_SECRET (minimum 32 characters)"
          assert os.environ.get("HF_TOKEN"), "Missing HF_TOKEN secret. Accept LTX-2.3 and Gemma model terms and add a read token as HF_TOKEN."
          print("Secrets present; budget caps validated. Secret values are never printed.")
          PY

      - name: Install Vast CLI and deployment tools
        run: |
          python -m pip install --upgrade vastai requests
          vastai set api-key "$VAST_API_KEY"

      - name: Search live Vast offers and select eligible RTX GPU
        id: offer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,requests,json
          key=os.environ["VAST_API_KEY"]
          cap=float(os.environ["MAX_HOURLY_USD"])
          bwcap=float(os.environ["MAX_BANDWIDTH_USD_PER_GB"])
          q={
            "limit":1000,
            "rentable":{"eq":True},
            "verified":{"eq":True},
            "gpu_name":{"in":["RTX 3090","RTX 4090"]},
            "num_gpus":{"eq":1},
            "gpu_ram":{"gte":24000},
            "inet_down":{"gte":1000},
            "reliability2":{"gte":0.95},
            "dph_total":{"lte":cap},
            "order":[["dph_total","asc"]]
          }
          r=requests.post("https://console.vast.ai/api/v0/bundles/",
             headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},
             json=q,timeout=60)
          r.raise_for_status()
          payload=r.json()
          offers=payload.get("offers",[]) if isinstance(payload,dict) else payload
          print(f"Vast live marketplace returned {len(offers)} candidate records.")
          accepted=[]
          for x in offers:
            name=str(x.get("gpu_name") or "").upper()
            if name not in ("RTX 3090","RTX 4090"): continue
            if x.get("verified") is False or x.get("rentable") is False or x.get("rented") is True: continue
            if float(x.get("gpu_ram") or 0)<24000 or float(x.get("gpu_frac") or 0)<0.99: continue
            if float(x.get("inet_down") or 0)<=1000: continue
            if float(x.get("reliability2") or x.get("reliability") or 0)<0.95: continue
            price=float(x.get("dph_total") or 999999)
            if price>cap: continue
            try:
              down=float(x["inet_down_cost"]); up=float(x["inet_up_cost"])
            except (KeyError,TypeError,ValueError):
              print("REJECT",x.get("id"),"unknown upload/download per-GB price")
              continue
            if down<=0 or up<=0 or down>bwcap or up>bwcap: continue
            accepted.append(x)
          if not accepted:
            raise SystemExit("No verified, rentable RTX 3090/4090 passed VRAM, speed, reliability, hourly and bandwidth caps. No rental was created.")
          accepted.sort(key=lambda x:(
            float(x["inet_down_cost"])+float(x["inet_up_cost"]),
            -float(x.get("reliability2") or x.get("reliability") or 0),
            -float(x.get("inet_down") or 0),
            float(x.get("dph_total") or 999999)))
          x=accepted[0]
          print("SELECTED OFFER",
            json.dumps({k:x.get(k) for k in ("id","gpu_name","gpu_ram","dph_total","inet_down","inet_up","inet_down_cost","inet_up_cost","reliability2","geolocation","host_id","machine_id")},sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("offer_id="+str(x["id"])+"\n")
            f.write("offer_gpu="+str(x.get("gpu_name") or "RTX") + "\n")
            f.write("offer_price="+str(x.get("dph_total") or "")+"\n")
          PY

      - name: Prepare GPU-native app.py onstart agent
        shell: bash
        run: |
          set -euo pipefail
          test -s neo/worker/ltx_worker.py.gz.b64
          test -s neo/worker/vast_ltx_onstart.sh.tpl
          python - <<'PY'
          from pathlib import Path
          import os
          template=Path("neo/worker/vast_ltx_onstart.sh.tpl").read_text()
          worker=Path("neo/worker/ltx_worker.py.gz.b64").read_text().strip()
          if "__WORKER_B64__" not in template: raise SystemExit("onstart template placeholder missing")
          if not worker or any(c not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\n" for c in worker):
              raise SystemExit("worker payload is not valid base64")
          script=template.replace("__WORKER_B64__",worker)
          Path("/tmp/neo-ltx-onstart.sh").write_text(script)
          Path("/tmp/neo-ltx-onstart.sh").chmod(0o700)
          print("Built self-contained Vast onstart script from the exact worker embedded in the supplied app.py.")
          print("Worker bootstrap installs LTX dependencies, downloads gated weights on the GPU, and exposes worker API on port 8190.")
          PY

      - name: Check live account inventory before rental
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,requests,sys
          h={"Authorization":"Bearer "+os.environ["VAST_API_KEY"]}
          r=requests.get("https://console.vast.ai/api/v0/instances/",headers=h,timeout=30)
          r.raise_for_status()
          d=r.json()
          rows=d.get("instances",d) if isinstance(d,dict) else d
          active=[]
          for x in rows if isinstance(rows,list) else []:
            state=str(x.get("actual_status") or x.get("status") or "").lower()
            if state not in ("exited","deleted","destroyed"):
              active.append({k:x.get(k) for k in ("id","gpu_name","actual_status","status","label")})
          if active:
            print("Existing non-terminal Vast instances found. Refusing a duplicate rental:")
            for x in active: print(x)
            raise SystemExit("Resolve/reuse the existing instance before starting another NEO rental.")
          print("Live Vast account inventory is clear; safe to create one new instance.")
          PY

      - name: Rent GPU with app.py agent bootstrap (no SSH)
        id: rent
        shell: bash
        run: |
          set -euo pipefail
          LABEL="NEO-LTX23-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export LABEL
          python - <<'PY'
          import os,subprocess,json,time,requests,re,sys
          key=os.environ["VAST_API_KEY"]
          def q(v):
            import shlex
            return shlex.quote(str(v))
          env="-p 8190:8190 -e HF_TOKEN="+q(os.environ["HF_TOKEN"])+" -e NEO_WORKER_TOKEN="+q(os.environ["NEO_WORKER_TOKEN"])+" -e NEO_BUCKET="+q(os.environ.get("NEO_BUCKET","Tinae/neo-bucket"))
          cmd=["vastai","create","instance",os.environ["OFFER_ID"],"--image","pytorch/pytorch:2.9.0-cuda13.0-cudnn9-devel","--disk","300","--env",env,"--onstart","/tmp/neo-ltx-onstart.sh","--label",os.environ["LABEL"],"--raw","--cancel-unavail"]
          print("Creating one GPU using Vast --onstart. No SSH key, SSH port, or SSH bootstrap is requested.",flush=True)
          p=subprocess.run(cmd,text=True,capture_output=True,timeout=180)
          print("Vast create stdout:",p.stdout[-4000:],flush=True)
          if p.stderr: print("Vast create stderr:",p.stderr[-4000:],flush=True)
          if p.returncode: raise SystemExit("Vast create command failed; no instance is assumed.")
          iid=None
          try:
            obj=json.loads(p.stdout.strip())
            if isinstance(obj,dict):
              iid=obj.get("new_contract") or obj.get("id") or (obj.get("instances") or [{}])[0].get("id")
            elif isinstance(obj,list) and obj: iid=obj[0].get("id")
          except Exception: pass
          headers={"Authorization":"Bearer "+key}
          for n in range(24):
            if not iid:
              try:
                z=requests.get("https://console.vast.ai/api/v0/instances/",headers=headers,timeout=20)
                z.raise_for_status()
                payload=z.json(); rows=payload.get("instances",payload) if isinstance(payload,dict) else payload
                matches=[x for x in rows if str(x.get("label") or "")==os.environ["LABEL"]]
                if matches: iid=str(matches[-1]["id"])
              except Exception as e: print("Inventory ID resolution retry:",type(e).__name__,str(e)[:180],flush=True)
            if iid: break
            print(f"Waiting for provider to assign the exact instance ID ({n+1}/24).",flush=True)
            time.sleep(5)
          if not iid: raise SystemExit("Vast accepted create but exact instance ID could not be reconciled by label; do not create another GPU.")
          Path="instance_id.txt"
          open(Path,"w").write(str(iid))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("instance_id="+str(iid)+"\n")
          print("VAST_INSTANCE_ID="+str(iid),flush=True)
          PY
        env:
          OFFER_ID: ${{ steps.offer.outputs.offer_id }}

      - name: Track Vast boot and LTX API every 5 seconds
        id: monitor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,json,requests,sys
          iid=os.environ["INSTANCE_ID"]
          key=os.environ["VAST_API_KEY"]
          headers={"Authorization":"Bearer "+key}
          deadline=time.time()+150*60
          last_phase=None
          api_url=None
          print(f"Monitoring exact Vast instance {iid}; polling provider and worker every 5 seconds.",flush=True)
          while time.time()<deadline:
            try:
              r=requests.get(f"https://console.vast.ai/api/v0/instances/{iid}/",headers=headers,timeout=20)
              r.raise_for_status()
              payload=r.json()
              detail=payload.get("instances",payload) if isinstance(payload,dict) else payload
              if isinstance(detail,list): detail=next((x for x in detail if str(x.get("id"))==iid),{})
              state=str(detail.get("actual_status") or detail.get("status") or "unknown").lower()
              print(f"[{time.strftime('%H:%M:%S',time.gmtime())}Z] VAST instance={iid} state={state} status_msg={str(detail.get('status_msg') or '')[:160]}",flush=True)
              if state in ("exited","destroyed","deleted","error"):
                raise SystemExit(f"Vast instance entered terminal state {state}; instance is preserved for inspection.")
              ports=detail.get("ports") or {}
              external=None
              if isinstance(ports,dict):
                for k,v in ports.items():
                  if str(k).split("/")[0].strip()!="8190": continue
                  for row in (v if isinstance(v,list) else [v]):
                    if isinstance(row,dict):
                      p=row.get("HostPort",row.get("host_port",row.get("public_port",row.get("external_port"))))
                      if p and str(p).isdigit(): external=int(p); break
                  if external: break
              host=str(detail.get("public_ipaddr") or detail.get("public_ip") or detail.get("public_ip_address") or detail.get("ip_address") or "").strip().strip("[]")
              if external and host and host not in ("0.0.0.0","127.0.0.1","localhost"):
                api_host=f"[{host}]" if ":" in host and not host.startswith("[") else host
                api_url=f"http://{api_host}:{external}"
                try:
                  h=requests.get(api_url+"/health",timeout=8)
                  h.raise_for_status()
                  health=h.json()
                  phase=str(health.get("phase") or "unknown")
                  if phase!=last_phase:
                    print(f"WORKER API ONLINE: {api_url} phase={phase} ready={health.get('ready')}",flush=True)
                    last_phase=phase
                  else:
                    print(f"WORKER PHASE: {phase}; ready={health.get('ready')}",flush=True)
                  if health.get("ready") is True and health.get("ok") is True:
                    print("NEO_LTX_WORKER_READY — unauthenticated health endpoint confirms LTX-2.3 model and CLI checks passed.",flush=True)
                    with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                      f.write("api_url="+api_url+"\n")
                    open("worker-health.json","w").write(json.dumps(health,indent=2))
                    sys.exit(0)
                  if health.get("error"): print("BOOTSTRAP ERROR:",str(health["error"])[:500],flush=True)
                except Exception as e:
                  print("Worker API not reachable yet:",type(e).__name__,str(e)[:200],flush=True)
              else:
                print("Vast has not published the mapped 8190/tcp port yet.",flush=True)
            except requests.RequestException as e:
              print("Provider status request failed; retrying same instance:",type(e).__name__,str(e)[:200],flush=True)
            time.sleep(5)
          raise SystemExit("Timed out waiting for the same Vast instance and LTX worker readiness. GPU is not auto-destroyed; inspect logs and inventory.")
          PY
        env:
          INSTANCE_ID: ${{ steps.rent.outputs.instance_id }}

      - name: Verify authenticated diagnostics API
        if: success()
        shell: bash
        env:
          API_URL: ${{ steps.monitor.outputs.api_url }}
          INSTANCE_ID: ${{ steps.rent.outputs.instance_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,hmac,hashlib,requests,json
          token=os.environ["NEO_WORKER_TOKEN"]
          stamp=str(int(time.time()))
          path="/diagnostics"
          msg=stamp+"\nGET\n"+path+"\n"+hashlib.sha256(b"").hexdigest()
          sig=hmac.new(token.encode(),msg.encode(),hashlib.sha256).hexdigest()
          r=requests.get(os.environ["API_URL"]+path,headers={"X-NEO-Time":stamp,"X-NEO-Signature":sig},timeout=20)
          r.raise_for_status()
          data=r.json()
          assert isinstance(data.get("bootstrap"),dict), "Worker diagnostics did not return bootstrap state"
          open("worker-diagnostics.json","w").write(json.dumps(data,indent=2))
          print("Authenticated worker diagnostics passed for instance",os.environ["INSTANCE_ID"])
          print("Bootstrap state:",json.dumps(data["bootstrap"],sort_keys=True))
          print("Startup log tail:\n",data.get("startup_log_tail","")[-5000:])
          print("Worker log tail:\n",data.get("worker_log_tail","")[-5000:])
          PY

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.rent.outputs.instance_id }}
          API_URL: ${{ steps.monitor.outputs.api_url }}
          OFFER_ID: ${{ steps.offer.outputs.offer_id }}
          GPU_NAME: ${{ steps.offer.outputs.offer_gpu }}
          GPU_PRICE: ${{ steps.offer.outputs.offer_price }}
        run: |
          {
            echo "## NEO LTX-2.3 GPU deployment"
            echo
            echo "- Offer: $OFFER_ID ($GPU_NAME)"
            echo "- Hourly provider price: $GPU_PRICE USD/h"
            echo "- Vast instance: ${INSTANCE_ID:-not resolved}"
            echo "- Worker API: ${API_URL:-not reachable}"
            echo "- Poll interval: 5 seconds"
            echo "- Deployment method: Vast --onstart + port 8190; no SSH"
            echo "- GPU cleanup: failed deployments are preserved for diagnosis"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-ltx-deploy-${{ github.run_id }}
          path: |
            instance_id.txt
            worker-health.json
            worker-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Destroy GPU only when explicitly requested after success
        if: success() && inputs.keep_gpu == false
        shell: bash
        run: |
          set -euo pipefail
          ID="${{ steps.rent.outputs.instance_id }}"
          echo "Explicit keep_gpu=false; destroying verified instance $ID."
          vastai destroy instance "$ID" -y
