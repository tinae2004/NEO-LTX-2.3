name: NEO FastFrame - Vast GPU Training

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Maximum total rental budget in USD, including 25% reserve"
        required: true
        type: string
        default: "3"
      max_hourly_usd:
        description: "Maximum Vast.ai hourly price in USD"
        required: true
        type: string
        default: "0.30"
      max_hours:
        description: "Maximum rental duration (0.25 to 3.0 hours)"
        required: true
        type: string
        default: "0.3"
      epochs:
        description: "Maximum epochs; early stopping enabled"
        required: true
        default: "80"
        type: string
      samples:
        description: "Generated synthetic training samples"
        required: true
        default: "12000"
        type: string
      gpu_order:
        description: "GPU preference order"
        required: true
        default: "RTX 3090,RTX 4090"
        type: choice
        options:
          - "RTX 3090,RTX 4090"
          - "RTX 4090,RTX 3090"
          - "RTX 3090"
          - "RTX 4090"
  push:
    branches: [neo-video-gen]
    paths:
      - ".github/neo-gpu-launch.once"

permissions:
  contents: read

concurrency:
  group: neo-fastframe-vast-training
  cancel-in-progress: false

jobs:
  rent-train-collect-destroy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'LAUNCH NEO GPU TRAINING - ONCE') }}
    name: Rent GPU, train, collect checkpoints, destroy rental
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender runtime dependencies on free runner
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils ca-certificates xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1 libsm6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install pinned Blender on free runner
        env:
          BLENDER_VERSION: "4.5.16"
        run: |
          set -euo pipefail
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          BASE_URL="https://download.blender.org/release/Blender4.5"
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 --retry-delay 2 -o "$ARCHIVE" "$BASE_URL/$ARCHIVE"
          tar -xf "$ARCHIVE"
          echo "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
          xvfb-run -a env -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" --background --python-expr "import bpy; print('Blender:', bpy.app.version_string)"

      - name: Build synthetic and Blender training data before GPU rental
        env:
          NEO_SAMPLES: ${{ inputs.samples || '12000' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          mkdir -p vast-training-input data/captures
          python scripts/generate_synthetic_dataset.py --samples "$NEO_SAMPLES" --size 64 --seed 20261111 --output vast-training-input/synthetic_v1
          blender --background --python scripts/create_blender_demo_scene.py -- --output data/neo_demo_scene.blend --renderer EEVEE
          blender --background data/neo_demo_scene.blend --python scripts/blender_capture.py -- --output data/captures/head_turn --start 1 --end 9 --profile FULL --skip-render
          python scripts/build_dataset_from_blender.py --capture data/captures/head_turn --output vast-training-input/blender_head_turn --action-id 0
          blender --background data/neo_demo_scene.blend --python scripts/blender_capture.py -- --output data/captures/left_arm_raise --start 10 --end 18 --profile FULL --skip-render
          python scripts/build_dataset_from_blender.py --capture data/captures/left_arm_raise --output vast-training-input/blender_left_arm --action-id 1
          blender --background data/neo_demo_scene.blend --python scripts/blender_capture.py -- --output data/captures/walk_step --start 19 --end 27 --profile FULL --skip-render
          python scripts/build_dataset_from_blender.py --capture data/captures/walk_step --output vast-training-input/blender_walk --action-id 4
          python scripts/merge_datasets.py --inputs vast-training-input/synthetic_v1 vast-training-input/blender_head_turn vast-training-input/blender_left_arm vast-training-input/blender_walk --output vast-training-input/combined_v1
          test -s vast-training-input/combined_v1/train.npz
          test -s vast-training-input/combined_v1/val.npz

      - name: Install Vast control dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests vastai

      - name: Provision Vast GPU and train NEO
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEO_BUDGET_USD: ${{ inputs.budget_usd || '3' }}
          NEO_MAX_HOURLY_USD: ${{ inputs.max_hourly_usd || '0.30' }}
          NEO_MAX_HOURS: ${{ inputs.max_hours || '0.3' }}
          NEO_EPOCHS: ${{ inputs.epochs || '80' }}
          NEO_SAMPLES: ${{ inputs.samples || '12000' }}
          NEO_GPU_ORDER: ${{ inputs.gpu_order || 'RTX 3090,RTX 4090' }}
        run: |
          python scripts/run_vast_gpu_training.py \
            --budget-usd "$NEO_BUDGET_USD" \
            --max-hourly-usd "$NEO_MAX_HOURLY_USD" \
            --max-hours "$NEO_MAX_HOURS" \
            --epochs "$NEO_EPOCHS" \
            --samples "$NEO_SAMPLES" \
            --gpu-order "$NEO_GPU_ORDER"

      - name: Upload GPU training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-fastframe-vast-gpu-training
          path: vast-training-output/
          if-no-files-found: warn
          retention-days: 30
